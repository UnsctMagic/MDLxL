name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # MDLxL ships as a Windows portable app, so build and test where it runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.28.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Tests do not launch Electron, so skip its large runtime download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm run build
      - name: Compatibility tests
        run: pnpm test
      - name: Full test suite
        # A per-test timeout makes a hanging test fail with its name instead of
        # stalling the job; the step timeout is a backstop.
        timeout-minutes: 30
        run: node --test --test-timeout=120000 --test-reporter=spec "test/*.test.js"
