name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # MDLxL ships as a Windows portable app, so build and test where it runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.28.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Tests do not launch Electron, so skip its large runtime download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm run fetch-ffmpeg
      - run: pnpm run build
      - name: Compatibility tests
        run: pnpm test
      - name: Full test suite
        # Fails only on tests outside .github/known-test-failures.txt, so the
        # pre-existing failures do not hide or block new regressions. A per-test
        # timeout turns a hanging test into a named failure.
        timeout-minutes: 30
        shell: bash
        run: |
          node --test --test-timeout=120000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./.github/test-annotations.mjs --test-reporter-destination=test-failures.txt \
            "test/*.test.js" || true
          node .github/check-test-baseline.mjs test-failures.txt .github/known-test-failures.txt
