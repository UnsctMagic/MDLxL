name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # MDLxL ships as a Windows portable app, so build and test where it runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          # Source tests do not launch Electron.
          skip-electron-download: '1'
      - name: Compatibility tests
        run: pnpm test
      - name: Full test suite
        # Fails only on tests outside .github/known-test-failures.txt, so the
        # pre-existing failures do not hide or block new regressions. A per-test
        # timeout turns a hanging test into a named failure. It is 5 minutes
        # because the large preview-ffmpeg GIF test takes up to ~110 s on CI.
        timeout-minutes: 30
        shell: bash
        run: |
          node --test --test-timeout=300000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./.github/test-annotations.mjs --test-reporter-destination=test-failures.txt \
            "test/*.test.js" || true
          node .github/check-test-baseline.mjs test-failures.txt .github/known-test-failures.txt
