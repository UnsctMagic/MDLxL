name: Draft release

# Pushing a version tag (for example v0.23.1) builds the portable Windows package
# and creates a DRAFT GitHub release. A draft is never offered by the in-app
# updater and does not trigger the Discord announcement. Review it, run the
# updater release gate (docs/UPDATER_RELEASE_GATE.md), attach the FFmpeg
# corresponding-source ZIP, then publish it by hand.
#
# Running this workflow manually (Actions > Draft release > Run workflow) from
# a branch is a dry run: it builds the same ZIP and attaches it to the run for
# 3 days, and creates no tag or release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-build
      - run: pnpm test
      - name: Package
        run: pnpm run package

      - name: Zip the portable package
        shell: pwsh
        run: |
          $zip = "MDLxL-$env:VERSION-win32-x64.zip"
          # Windows' bsdtar writes a standard ZIP with forward-slash entry names.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip -C release MDLxL-win32-x64
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          # Same ZIP under a fixed name, so releases/latest/download/MDLxL-win32-x64.zip
          # is one link that never changes (website, XGM). The updater ignores it.
          Copy-Item $zip MDLxL-win32-x64.zip
          "{0:N1} MB  {1}" -f ((Get-Item $zip).Length / 1MB), $zip
          Get-Content "$zip.sha256"

      - name: Create the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="MDLxL-${VERSION}-win32-x64.zip"
          notes="docs/RELEASE-${VERSION}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" MDLxL-win32-x64.zip \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "MDLxL ${VERSION}" "${notes_args[@]}"
          {
            echo "### Draft release created for MDLxL ${VERSION}"
            echo "Before publishing:"
            echo "- Run the updater release gate (docs/UPDATER_RELEASE_GATE.md) on this ZIP."
            echo "- Attach MDLxL-FFmpeg-corresponding-source.zip (see electron/ffmpeg/REDISTRIBUTION.md)."
            echo "- Add the English/Русский/简体中文 post links to the release body and publish the website post."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the ZIP to this run (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MDLxL-${{ env.VERSION }}-win32-x64-dry-run
          path: |
            MDLxL-*-win32-x64.zip
            MDLxL-*-win32-x64.zip.sha256
          retention-days: 3
